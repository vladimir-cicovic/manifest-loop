# Example nginx site for a permanent manifest-loop setup (e.g. on a home server or Raspberry Pi).
#
# 1. Copy the project to /var/www/manifest-loop
# 2. Build the playlist:      bash /var/www/manifest-loop/scripts/generate-playlist.sh
# 3. Install this file:       sudo cp manifest-loop.conf /etc/nginx/sites-available/
#                             sudo ln -s /etc/nginx/sites-available/manifest-loop.conf /etc/nginx/sites-enabled/
# 4. Test and reload nginx:   sudo nginx -t && sudo systemctl reload nginx
#
# Then open http://<server-ip>:8080 from any device on your network.

server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    root /var/www/manifest-loop;
    index index.html;

    # Keep the playlist fresh so new images show up after you regenerate it
    location = /playlist.js {
        add_header Cache-Control "no-cache";
    }

    # Images and music rarely change: cache them in the browser for a week.
    # nginx serves byte ranges for static files, so seeking inside audio works out of the box.
    location ~* ^/(images|music)/ {
        expires 7d;
        add_header Cache-Control "public";

        # Formats missing from some default mime.types files.
        # (A types block here only overrides the type for these locations, not the whole site.)
        location ~* \.(opus|oga)$ { types { } default_type audio/ogg; }
        location ~* \.flac$       { types { } default_type audio/flac; }
        location ~* \.avif$       { types { } default_type image/avif; }
    }

    # Do not serve the helper scripts or git metadata
    location ~ ^/(scripts|nginx)/ { deny all; }
    location ~ /\.(?!well-known) { deny all; }
    location ~* \.(bat|sh|ps1|md)$ { deny all; }

    # Optional: restrict access to your home network only
    # allow 192.168.0.0/16;
    # allow 10.0.0.0/8;
    # deny all;
}
